# Local development infrastructure. The apps run on the host (pnpm dev).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby
      POSTGRES_DB: lobby
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for local dev (MinIO no longer publishes images).
  # ponytail: floating tag is fine for local dev; pin a digest if it ever breaks.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot: creates the private documents bucket, then exits.
  s3-init:
    image: amazon/aws-cli:2.37.12
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: lobby
      AWS_SECRET_ACCESS_KEY: lobby-s3-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "for i in $$(seq 1 30); do
      aws --endpoint-url http://s3:8333 s3api head-bucket --bucket lobby-documents 2>/dev/null && exit 0;
      aws --endpoint-url http://s3:8333 s3 mb s3://lobby-documents && exit 0;
      sleep 2; done; exit 1"

volumes:
  postgres-data:
  s3-data:
